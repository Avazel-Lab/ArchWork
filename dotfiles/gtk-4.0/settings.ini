# GTK 4, themed to match Kvantum (D-020).
#
# Managed by ArchWork. GTK 4 applications built on libadwaita largely ignore
# gtk-theme-name and follow their own stylesheet, so the setting that does the
# work here is the dark preference. Named all the same, for the GTK 4
# applications that are not libadwaita.
[Settings]
gtk-theme-name = Materia-dark
gtk-application-prefer-dark-theme = true
gtk-font-name = Inter 11
gtk-cursor-theme-size = 24
