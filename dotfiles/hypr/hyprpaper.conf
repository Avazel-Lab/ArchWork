# hyprpaper, the wallpaper (desktop-shell.md, D-001, D-032).
#
# Managed by ArchWork. This file is the one in the repository: the dotfiles
# role links ~/.config/hypr at the clone, same as hyprland.lua, hyprlock.conf
# and hypridle.conf.
#
# The wallpaper is the keybinding cheat sheet, generated from the bindings
# themselves by scripts/make-keybinding-wallpaper.py rather than drawn by
# hand. A cheat sheet maintained separately is wrong the first time somebody
# edits a binding and forgets it, and a wrong one on the desktop is worse than
# none, so the generator refuses to run if the two disagree.
#
# It is deliberately a placeholder for a chosen wallpaper rather than a
# permanent one. Changing it is the path below.
#
# The block form is hyprpaper 0.8's, and the `preload =` plus `wallpaper = ,path`
# pair it replaced is why this displayed nothing for a day (D-032). 0.8 moved to
# the hyprtoolkit and hyprwire backends and changed its configuration with them.
# The old keys are not rejected: they are read, they produce no wallpaper, and
# the only sign is "Monitor X has no target: no wp will be created" in a log
# nobody was reading. That is the migration D-026 recorded arriving at Hyprland
# itself, one tool further along.

# An empty monitor is the fallback, applying to every monitor with no entry of
# its own. Both profiles want that: the desktop drives more than one display
# and the laptop drives its panel.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpaper-keybindings.png
    # contain, not the default cover. cover crops to fill the screen, and what
    # it would crop off a 2560x1440 sheet on a differently shaped display is
    # the bindings down the edges. A cheat sheet missing the parts you have not
    # memorised yet is not much of a cheat sheet.
    fit_mode = contain
}
