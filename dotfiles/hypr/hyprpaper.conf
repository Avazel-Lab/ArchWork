# hyprpaper, the wallpaper (desktop-shell.md, D-001).
#
# Managed by ArchWork. This file is the one in the repository: the dotfiles
# role links ~/.config/hypr at the clone, same as hyprland.lua, hyprlock.conf
# and hypridle.conf.
#
# hyprpaper is a separate binary from Hyprland and still reads hyprlang. D-026
# migrated hyprland.conf and nothing else, the same reasoning that left the
# other two files alone.
#
# The wallpaper is the keybinding cheat sheet, generated from the bindings
# themselves by scripts/make-keybinding-wallpaper.py rather than drawn by
# hand. A cheat sheet maintained separately is wrong the first time somebody
# edits a binding and forgets it, and a wrong one on the desktop is worse than
# none, so the generator refuses to run if the two disagree.
#
# It is deliberately a placeholder for a chosen wallpaper rather than a
# permanent choice. Nothing here stops it being replaced once the desktop is
# familiar: change the two paths below, or point them at anything else.

preload = ~/.config/hypr/wallpaper-keybindings.png

# An empty monitor field means every monitor, which is what both profiles want:
# the desktop drives more than one and the laptop drives its panel.
wallpaper = , ~/.config/hypr/wallpaper-keybindings.png

# The image is rendered at the size the file says and scaled to fit, so a
# monitor that is not 2560x1440 gets the whole sheet rather than a crop.
splash = false
