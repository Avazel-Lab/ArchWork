# hypridle, the M4 timings (security-power.md, D-028).
#
# Managed by ArchWork. This file is the one in the repository: the dotfiles
# role links ~/.config/hypr at the clone, same as hyprland.lua and
# hyprlock.conf, so an edit made on the machine is an edit to the repository.
#
# hypridle is a separate binary from Hyprland and still reads this format.
# D-026 only migrated hyprland.conf itself to Lua; hyprlock.conf stayed on it
# for the same reason, and nothing has deprecated it here either.
#
# Each listener's timeout is measured from the same last-activity clock
# independently, not chained on top of the one before it: dim fires at 5
# minutes idle, display-off at 15, sleep at 30, exactly as security-power.md
# states them, not 5-then-10-more-then-15-more.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim after 5 minutes. brightnessctl finds no backlight device on the
# desktop's external monitors and no-ops there; it is the real effect on the
# laptop's panel, and hypridle does not care whether the command it runs
# succeeds.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Display off after 15 minutes, and sleep after 30, are both disabled below
# for now (D-044, D-045). Two separate incidents on 2026-09-04 cost keyboard
# and mouse control on hmlxdesktop02: one through the sleep listener's
# systemctl suspend, xHCI failing to reinitialise on resume; one with no
# suspend in it at all, closer in timing to the display-off listener, still
# undiagnosed. This is a stopgap, not a fix for either: re-enable both
