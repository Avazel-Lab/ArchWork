# Hyprlock, the M3 lock screen.
#
# Managed by ArchWork. Enough to lock the session and take a password back,
# which is what the M3 criteria ask of it. No wallpaper and no colour scheme:
# the theme is still open (D-020), and hyprlock is one of the things
# desktop-shell.md marks for replacement or integration with Quickshell later.

background {
    monitor =
    color = rgb(28, 28, 28)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 2
    dots_center = true
    # Say what the machine is doing rather than leaving a silent box: a lock
    # screen that gives no feedback is indistinguishable from one that has
    # hung, which is a bad thing to wonder about at your own machine.
    placeholder_text = Locked. Enter your password.
    fail_text = Wrong password
    # hyprlock fades an empty field out entirely by default, placeholder and
    # all, which defeats the line above: the capture from 2026-08-29 shows a
    # lock screen with a clock and no visible way to type at it. A field you
    # cannot see is the silent box that comment set out to avoid.
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_size = 48
    position = 0, 80
    halign = center
    valign = center
}
