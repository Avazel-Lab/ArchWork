# GTK 3, themed to match Kvantum (D-020).
#
# Managed by ArchWork. xdg-desktop-portal-gtk is a GTK 3 application, so this
# file is what decides how the portal file chooser looks. Before it existed
# that chooser came up light against a dark desktop, which is the mismatch
# desktop-shell.md means when it asks for "a matching GTK theme".
#
# Materia-dark here, MateriaDark in ../Kvantum/kvantum.kvconfig. They are the
# same theme by the same project, which is why this counts as matching rather
# than as two themes that happen to be dark.
[Settings]
gtk-theme-name = Materia-dark
gtk-application-prefer-dark-theme = true
gtk-icon-theme-name = Papirus-Dark
gtk-font-name = Inter 11
gtk-cursor-theme-size = 24
