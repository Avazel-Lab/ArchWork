# M5 started on 2026-09-01 (D-030), while the M4 evidence run was still going.
# archwork-snapshot, archwork-health and archwork-update are written and unit
# tested, with the btrbk configuration and the pacman pre-transaction hook
# D-007 promised, placed by a new snapshots role. 26 unit tests, all stubs:
# no btrbk has taken a snapshot, no hook has fired, and no rollback has run.
#
# Three of M5's six exit criteria are VM work not yet started: break a machine
# and roll it back, check pacman -Qi agrees with the disk afterwards, and boot
# the recovery UKI to run the rollback from it. make vm-health and
# make vm-recovery are still the stubs that print what milestone delivers them.
# M5's rollback criteria passed on 2026-09-02 on the desktop profile. The
# phase proved the machine healthy, snapshotted it through btrbk, removed
# tailscale and stopped the service, watched the health check notice, rolled
# back with archwork-rollback, rebooted, and found the machine itself again:
# 19 health checks passed with nothing failed, pacman -Qk agreed with the
# disk, and the removed package was back. That is three of M5's six exit
# criteria, and the fourth, the recovery UKI, is a separate phase that has
# not been run since M1.
#
# Run 23 on 2026-09-03 at commit e970eec is the first vm-power run to pass
# end to end, on the desktop profile. In one unattended pass: installed from
# the ISO, asserted the M1 criteria, reconciled twice with the second run
# reporting changed=0, reached the greeter and logged in, passed every M3
# session criterion, opened the portal file picker from GTK and from Qt,
# passed the M4 timings including the suspend at 1805s, ran archwork-update
# through to its health checks, broke itself on purpose and watched the
# health check notice, rolled back and rebooted onto the rolled-back root,
# and booted the recovery UKI to a rescue shell where archwork-rollback
# listed snapshots.
#
# The only two FAILs in its transcript are the deliberate break, and the line
# after them is the health check noticing it.
#
# It is also the first run to assert the keybinding wallpaper rather than
# skip it. That answers D-032: a VM can draw it, so the criterion no longer
# waits on hardware. What hmlxdesktop02 still settles is whether it looks
# right on a real panel, which is a person looking (D-021).
#
# Two harness defects were fixed to get here, both found by booting the disk
# of the run that had failed rather than by reasoning from outside it.
# D-037: virtio-gpu does not survive S3, so the guest runs on std VGA now.
# D-039: the wallpaper check started a second hyprpaper and broke the
# wallpaper it was about to assert. D-038 is why those disks were still there
# to be asked.
#
# The application baseline reached the manifests on 2026-09-01 (D-029): 84
# packages from the official repositories, 9 shared AUR packages, and gaming,
# local AI and OpenDeck on the desktop profile only, with multilib enabled
# there because Steam cannot install without it. Run 23 installed them and
# still reported changed=0 on the second reconcile, which is what would have
# caught one of them writing its own configuration on first run.
#
# Run 25 on 2026-09-04 at commit a65e85a repeated all of that on the laptop
# profile, unattended and green, including the swapfile and hibernate path the
# desktop does not have.
#
# Run 27 on 2026-09-04 at commit cea54d2 is the current record, desktop
# profile, and it is what proves D-040 and D-035: the aurbuild bind mount
# reconciles and the second run reports changed=0, joplin-bin and opendeck-bin
# build and install where their source builds had failed. Every run above has
# the same two FAILs and no others, and they are the deliberate break.
#
# Run 26 is the one worth remembering, because it failed. D-040's mount unit
# broke ansible-playbook --check at minute one: under --check the template
# writes nothing, so systemd_service could not find the unit it was asked to
# enable. Nothing in make check can see that. Only a run against a real
# machine can.
#
# Not proven: M7's three consecutive rebuilds. D-029 also leaves three questions
# for the repository owner: Codex CLI, how Python 3.13 is pinned, and
# libvirt's two unnamed dependencies.

