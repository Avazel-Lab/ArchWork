# A rebuild claim without a commit SHA is rejected by the checker.
# Clean install from the ISO, M1 assertions, the D-016 reconciliation twice
# with the second run reporting zero changed tasks, and the recovery UKI.
# Both profiles on this commit, run separately: the desktop, then the laptop
# with its @swap subvolume and swapfile that the desktop does not have. M3 had
# only ever been shown on the desktop profile before this.
#
# Everything M3 asks of a machine, on a session greetd starts through
# start-hyprland with its configuration in Lua (D-026): login at the real
# greeter, all 21 session assertions including the eight for Tailscale, the
# desktop driven by its own keybindings through lock and unlock, and a portal
# file picker from PDF Arranger and from Okular. The seven M2 service state
# assertions passed with it, and the second reconciliation reported changed=0.
#
# The theming criterion is judged and accepted, by the repository owner
# looking at the captures from this commit (D-020, D-021). The portal file
# chooser comes up dark and matching the desktop, where every earlier run had
# it light against it. That is the one M3 criterion settled by looking rather
# than by asserting.
#
# Tailscale is asserted only as far as a logged out machine allows. Split DNS
# against a real tailnet waits on the D-006 auth key.
last_rebuild:
  status: passed
  commit: 0d20ddfa9b3592ef3740f6f25b402afdb9984537
  date: 2026-08-29

# D-027 confirmed on hmlxdesktop02 at commit 85f8972, 2026-08-30. nvidia_drm,
# nvidia_modeset, nvidia_uvm and nvidia are the modules loaded, no nouveau,
# and hyprctl systeminfo names the GA104 [GeForce RTX 3060] with the NVIDIA
# open kernel module driving backend drm. That is Hyprland actually
# rendering through the real GPU, not just a session that came up: this is
# the desktop's first confirmed login on real hardware.
#
# M4 started on 2026-08-30 (D-028): hypridle and brightnessctl added to the
# session package set, the dim/display-off/sleep listeners written to
# dotfiles/hypr/hypridle.conf, and scripts/archwork-inhibit installed by a new
# power role for the sleep inhibit control.
#
# Running the phase on 2026-09-01 found four bugs, three of them reachable
# only by running it: a predicate nothing defined, a keystroke sendkey
# refused, hyprctl dispatch broken by D-026's move to Lua so the display never
# switched off, and a journal query reading systemd-logind for a message
# systemd-suspend.service emits. That last one was failing in the safe
# direction and passing in the dangerous one: its negation is what asserts the
# machine did not sleep under a held inhibitor, so that criterion had never
# been tested at all.
#
# The behaviour itself was observed on the run at f3c99b9's parent: display
# off at 901s, no sleep under the inhibitor, the display still off, suspend at
# 1805s measured from the QEMU monitor, locked on the way down, display back
# on after wake. That is not an evidence line, because no run has yet
# completed green end to end.

# One record per machine, replaced rather than appended to. The checker
# rejects an install claimed as passed without a commit SHA and a date, on
# the same terms as last_rebuild. This is the first exit criterion of M8 and
# M9: deployed from the same bootstrap as the VMs.
#
# The desktop: bare metal, real firmware, and the installer run by hand from
# docs/first-install.md at this commit. It installed and it booted. The
# desktop it booted into did not render until the NVIDIA driver above, so
# the commit here is what the installer ran from, not a commit that reaches
# a working session. It is not evidence for anything else M8 asks: no Steam,
# no controller, no @ai_models restore, no thirty days.
first_install:
  desktop:
    status: passed
    commit: f87cc05b4000304f951df920590097791b0f6b0b
    date: 2026-08-30
  laptop:
    status: never-run

# M5 started on 2026-09-01 (D-030), while the M4 evidence run was still going.
# archwork-snapshot, archwork-health and archwork-update are written and unit
# tested, with the btrbk configuration and the pacman pre-transaction hook
# D-007 promised, placed by a new snapshots role. 26 unit tests, all stubs:
# no btrbk has taken a snapshot, no hook has fired, and no rollback has run.
#
# Three of M5's six exit criteria are VM work not yet started: break a machine
# and roll it back, check pacman -Qi agrees with the disk afterwards, and boot
# the recovery UKI to run the rollback from it. make vm-health and
# make vm-recovery are still the stubs that print what milestone delivers them.
next_actions:
  - Run the M4 exit criteria against a clean VM rebuild and get a green run
    end to end. The behaviour is observed and the four bugs are fixed; what
    is missing is one run where every assertion passes. Record it with a
    commit SHA
  - Land the application manifests once a VM has installed them. They are on
    feat/application-manifests with CI green and no machine has run them
  - Point the VM harness at a work directory with room. TMPDIR defaults to
    /tmp, which is a 16 GB tmpfs on this development machine, and two 10 GB
    runs do not fit in it

blockers:
  - M4 has no VM evidence yet. The configuration, the inhibit control and
    now the automated check its last exit criterion asks for are all
    written and unit-tested, and nobody has yet watched the three timings
    fire or the inhibit lock hold on a real machine. The run is
    make vm-power ISO=..., and it takes about 65 minutes because the
    criteria are two idle windows of half an hour.
