# M7.5 was added on 2026-09-03 (D-036). It started on 2026-09-04:
# hmlxdesktop02 installed from the ISO and brought up with bootstrap.sh.
# The first login attempt hit D-027's symptom again, but D-027 itself was not
# wrong: nouveau was already gone. What was missing was every nvidia module,
# because nvidia-open's prebuilt build on the mirrors had not yet caught up
# to the kernel pacstrap had pulled, one release behind. Resolved on the
# machine by re-syncing until a matching nvidia-open build appeared, then
# upgrading and rebooting. No manifest change followed: D-043 records it as a
# recurring mirror-timing hazard rather than a bug this repository can fix.
#
# Login reached a session on 2026-09-04, and the machine has been used from
# since. The checkout moved to ~/projects/active/ArchWork (D-046) and the
# machine's own dotfiles symlinks were repointed by hand to match. A
# per-host ed25519 key was generated for GitHub and another for GitLab
# (user-guide.md documents the convention); every commit and push in this
# milestone's own evidence trail since has gone out from the machine itself
# over its own key, which answers that part of the milestone outright. Git
# identity and gh auth are deliberately not repository-managed, the same as
# the keys.
#
# Two real-hardware bugs surfaced the same evening that no VM run had ever
# shown: D-044, the desktop's first genuine suspend, which failed to resume
# (the xHCI controller, not the display); and D-045, a second and different
# input-loss incident the same night with no suspend in its journal at all.
# Neither is understood. hypridle.conf's display-off and sleep listeners are
# commented out as a stopgap, which is also why make check's unit target
# currently fails on main (see blockers).
#
# Still open: application launches, make check green on the machine, a
# second reconcile at zero changed, and archwork-health green. The last two
# need an actual bootstrap.sh/ansible-playbook run: bats, Krusader, Yazi,
# wl-clipboard and cliphist (D-047, D-048) were all installed by hand
# tonight to test them, not through the role, and archwork-health,
# archwork-update, archwork-snapshot and archwork-inhibit still do not exist
# anywhere on the machine.
#
# It is the one milestone that runs ahead of M7 on purpose: the applications
# have been in the manifests since D-029, and holding it unusable until three
# clean rebuilds pass keeps every hour of development inside an hour-long VM
# harness. The four gaps raised against it were all closed by the repository
# owner as out of scope: no drift detection, no boot order change, no /home
# backup, and end-to-end testing stays in Kubuntu. The Arch installation is
# disposable and that is what makes the milestone small.
#
# M5 continues to wait for M7.5 by decision: its rollback path has only ever
# run in a VM, and the owner wants real hardware to exercise it before it is
# called complete. Odysseus (D-042) is unstarted and not urgent; the answers
# it needs are recorded in applications.md and log.md and are not going
# anywhere.

