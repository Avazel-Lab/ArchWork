# A rebuild claim without a commit SHA is rejected by the checker.
# Clean install from the ISO, M1 assertions, the D-016 reconciliation twice
# with the second run reporting zero changed tasks, and the recovery UKI.
# The laptop profile on this commit, with its @swap subvolume and swapfile
# that the desktop does not have. The desktop profile passed the same way at
# e970eec on 2026-09-03. Both profiles have now been through a full vm-power
# run, which is what M4 and M5 had been resting on one profile for.
#
# Everything M3 asks of a machine, on a session greetd starts through
# start-hyprland with its configuration in Lua (D-026): login at the real
# greeter, all 21 session assertions including the eight for Tailscale, the
# desktop driven by its own keybindings through lock and unlock, and a portal
# file picker from PDF Arranger and from Okular. The seven M2 service state
# assertions passed with it, and the second reconciliation reported changed=0.
#
# The theming criterion is judged and accepted, by the repository owner
# looking at the captures from this commit (D-020, D-021). The portal file
# chooser comes up dark and matching the desktop, where every earlier run had
# it light against it. That is the one M3 criterion settled by looking rather
# than by asserting.
#
# Tailscale is asserted only as far as a logged out machine allows. Split DNS
# against a real tailnet waits on the D-006 auth key.
last_rebuild:
  status: passed
  commit: a65e85a2f8a0e3cb53b5f43ec7c2df721ce8f387
  date: 2026-09-04

# D-027 confirmed on hmlxdesktop02 at commit 85f8972, 2026-08-30. nvidia_drm,
# nvidia_modeset, nvidia_uvm and nvidia are the modules loaded, no nouveau,
# and hyprctl systeminfo names the GA104 [GeForce RTX 3060] with the NVIDIA
# open kernel module driving backend drm. That is Hyprland actually
# rendering through the real GPU, not just a session that came up: this is
# the desktop's first confirmed login on real hardware.
#
# M4 started on 2026-08-30 (D-028): hypridle and brightnessctl added to the
# session package set, the dim/display-off/sleep listeners written to
# dotfiles/hypr/hypridle.conf, and scripts/archwork-inhibit installed by a new
# power role for the sleep inhibit control.
#
# Running the phase on 2026-09-01 found four bugs, three of them reachable
# only by running it: a predicate nothing defined, a keystroke sendkey
# refused, hyprctl dispatch broken by D-026's move to Lua so the display never
# switched off, and a journal query reading systemd-logind for a message
# systemd-suspend.service emits. That last one was failing in the safe
# direction and passing in the dangerous one: its negation is what asserts the
# machine did not sleep under a held inhibitor, so that criterion had never
# been tested at all.
#
# Every M4 exit criterion passed on 2026-09-01 at commit 8558d4e, on the
# desktop profile: the display off at 904s against a 900 to 960 window, the
# machine still awake at the end of a 30 minute idle window with the inhibitor
# held, the display still off through it so the lock touched only sleep,
# suspend at 1805s measured from the QEMU monitor because a machine cannot
# time its own, logind and systemd-suspend both recording the sleep, hyprlock
# up before it went down, and the display back on after the wake.
#
# M4 is complete on the repository owner's decision of 2026-09-04, on the
# evidence of run 23 (desktop, e970eec) and run 25 (laptop, a65e85a). The SHA
# above is run 25's, the run that completed the pair.
#
# Observing the 5 minute dim moved from M4 to M9 on the same day and by the
# same decision. It cannot be seen where there is no backlight device, which is
# every VM, so it had been a skip on every run by design. M4 keeps the
# configuration assertion; M9 gets the observation, on the first machine with a
# panel. M4 is therefore complete on criteria that were all actually met,
# rather than complete with one that nothing had ever shown.
#
# The run did not complete. The recovery phase after M4 timed out waiting for
# a reboot, because the harness woke the guest with system_wakeup, which is
# not input, so the compositor's idle clock still read 1805s and hypridle put
# the machine straight back to sleep. Fixed on fix/wake-resets-the-idle-clock
# by sending the keystroke the wake had always claimed to be. M4 is therefore
# proven and the run that proves it end to end has not been done.

