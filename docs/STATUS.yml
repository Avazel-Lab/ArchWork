# Clean install from the ISO, M1 assertions, the D-016 reconciliation twice
# with the second run reporting zero changed tasks, and the recovery UKI.
# Desktop profile on this commit. Both profiles passed on d16cf4c.
#
# This run also drove the M3 desktop from outside the guest: login at the real
# greeter, all 21 session assertions including the eight for Tailscale,
# terminal and launcher by keybinding, lock and unlock, and a portal file
# picker from PDF Arranger and from Okular. The seven M2 service state
# assertions passed with it, so the D-025 group and socket are watched rather
# than assumed, and the second reconciliation reported changed=0.
#
# It is the first run on the D-026 changes: greetd starting the session
# through start-hyprland, and the configuration in Lua rather than hyprlang.
# Every keybinding the harness presses fired, which is what proves the
# dispatcher translations, and the capture shows both of the Hyprland warnings
# that prompted D-026 are gone.
#
# One M3 criterion is not in it. Kvantum and the GTK theme are judged from the
# captures by a person (D-021), and the GTK half cannot pass while D-020
# leaves that theme unchosen. Tailscale is asserted only as far as a logged
# out machine allows: split DNS against a real tailnet waits on the D-006
# auth key.
#
# Two commits after this one are unproven: a documentation change, and quoting
# the monitor scale in hyprland.lua. This run passed with it unquoted, so Lua
# coerced the number; the quoted form matches the string parser Hyprland
# actually uses and is what the next run should carry.
