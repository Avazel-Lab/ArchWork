# M7.5 was added on 2026-09-03 (D-036) and has not started. It is the one
# milestone that runs ahead of M7 on purpose: the machine is installed, the
# applications have been in the manifests since D-029, and holding it unusable
# until three clean rebuilds pass keeps every hour of development inside an
# hour-long VM harness. Nothing needs to be written for it. The four gaps
# raised against it were all closed by the repository owner as out of scope:
# no drift detection, no boot order change, no /home backup, and end-to-end
# testing stays in Kubuntu. The Arch installation is disposable and that is
# what makes the milestone small.

blockers:
  - No vm-power run has completed end to end. Run 21 on 2026-09-03 got the
    furthest and died on the reboot after the rollback. The cause is found
    and fixed (D-037), and the fix has been shown to work on its own; no
    full run has been done on it yet.
  - The keybinding wallpaper cannot be proven in a VM. hyprpaper 0.8 renders
    through hyprtoolkit and cannot allocate a buffer without a GPU, so its
    checks are skipped there and hmlxdesktop02 is what settles it (D-032).
