# M5 started on 2026-09-01 (D-030), while the M4 evidence run was still going.
# archwork-snapshot, archwork-health and archwork-update are written and unit
# tested, with the btrbk configuration and the pacman pre-transaction hook
# D-007 promised, placed by a new snapshots role. 26 unit tests, all stubs:
# no btrbk has taken a snapshot, no hook has fired, and no rollback has run.
#
# Three of M5's six exit criteria are VM work not yet started: break a machine
# and roll it back, check pacman -Qi agrees with the disk afterwards, and boot
# the recovery UKI to run the rollback from it. make vm-health and
# make vm-recovery are still the stubs that print what milestone delivers them.
# M5's rollback criteria passed on 2026-09-02 on the desktop profile. The
# phase proved the machine healthy, snapshotted it through btrbk, removed
# tailscale and stopped the service, watched the health check notice, rolled
# back with archwork-rollback, rebooted, and found the machine itself again:
# 19 health checks passed with nothing failed, pacman -Qk agreed with the
# disk, and the removed package was back. That is three of M5's six exit
# criteria, and the fourth, the recovery UKI, is a separate phase that has
# not been run since M1.
#
# Not an evidence line yet. The run that carried it, run 11, failed on its
# own reboot wait rather than on anything it was testing: 120 seconds of SSH
# attempts ran out while the machine was still starting services after a
# rollback that had worked. Booting the same disk by hand answered SSH at
# once, and re-running the phase alone passed everything. The window is now
# 300 seconds. A clean run end to end is what would make this evidence.
#
# The btrbk configuration D-030 flagged as the piece most likely to be wrong
# turned out to be right: it took the snapshot archwork-rollback then used.
# The application baseline reached the manifests on 2026-09-01 (D-029),
# ahead of M7 rather than during it. 84 packages from the official
# repositories in archwork_packages_applications, 9 shared AUR packages, and
# gaming, local AI and OpenDeck on the desktop profile only. Every name was
# checked against the Arch package API and the AUR RPC rather than recalled.
# multilib is enabled on the desktop, because Steam cannot install without
# it.
#
# The reason for doing it early is that the first login on hmlxdesktop02
# reached a desktop with nothing on it to work with, and M7 proves three
# rebuilds land the same machine: until the applications are in the
# manifests, that would prove repeatability of something short of the
# workstation.
#
# Not run. make check passes and both profiles resolve their lists with no
# duplicates, and no VM has installed any of it. The M2 idempotence test is
# what catches the likeliest failure, which is one of these packages writing
# its own configuration on first run and never reporting changed=0 again.
# D-029 also raises four questions the repository owner has to answer:
# Codex CLI, how Python 3.13 is pinned, libvirt's two unnamed dependencies,
# and the Epson scanner driver.
# Run 21 on 2026-09-03 is the furthest any run has reached. In one pass it
# installed 93 repository packages and 12 AUR packages, passed the dry run,
# reconciled twice with the second reporting changed=0, reached a session,
# skipped the wallpaper honestly because the guest has no GPU to draw it,
# passed every M4 timing including the suspend at 1805s, ran archwork-update
# through to its health checks for the first time, and broke itself on
# purpose and watched the health check notice.
#
# It then failed rebooting onto the rolled-back root, and that is now
# diagnosed and fixed (D-037). The disk was kept and booted, and the guest's
# own journal says the machine never rebooted at all: a kernel worker was
# stuck inside virtio_gpu after the resume from S3, holding the DRM modeset
# lock, and systemd-logind blocked behind it in uninterruptible sleep. That
# is an emulated device that does not survive a suspend, not a fault in
# anything this repository installs, and it is why the rollback phase passes
# when resumed on its own: only a full run suspends.
#
# The harness now boots the installed system on std VGA. Measured on the same
# disk, timed from the reboot request to QEMU exiting: virtio-vga did not
# finish within 700 seconds, and std VGA finished in 4. Hyprland starts on it
# and both the greeter and the session captured, so D-021 is unaffected.
#
# No claim is made about hardware. hmlxdesktop02 has an RTX 3060 and no
# virtio-gpu, so nothing here says whether a real machine that has slept
# reboots promptly.

