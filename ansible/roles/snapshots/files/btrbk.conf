# btrbk, the snapshot and retention policy (D-007).
#
# Managed by ArchWork. One tool covers snapshots here and btrfs send/receive to
# the NAS at M8, which is why this is btrbk and not snapper: two tools with
# overlapping models of the same subvolumes would carry two retention policies
# that can disagree.
#
# Only @ is snapshotted. /home, @var_log, @var_cache, @ai_models and @swap sit
# outside the rollback boundary by design (storage-boot.md, CLAUDE.md), and a
# snapshot of them would imply a rollback that this project deliberately does
# not offer. @home goes to the NAS at M8 through this same tool, as a target
# rather than as a snapshot.

# Timestamps that sort the way a human reads them, which is what
# archwork-rollback lists.
timestamp_format        long

# Keep every snapshot for two days whatever else the policy says, so an update
# that goes wrong on a Friday is still recoverable on a Sunday.
snapshot_preserve_min   2d

# Then thin out: daily for a fortnight, weekly for two months. The pacman hook
# means one snapshot per package transaction, so a busy week is dozens of
# them, and @snapshots shares the filesystem with everything else.
snapshot_preserve       14d 8w

# Snapshots are read-only. archwork-rollback takes a writable copy rather than
# rolling one in place, so nothing needs to write to these.
snapshot_create         onchange

volume /
  snapshot_dir          .snapshots
  subvolume             .
    snapshot_name       root
