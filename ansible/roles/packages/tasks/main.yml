---
# Reconcile the package set. The profile difference arrives as a group
# variable, so this file never asks which machine it is running on.
- name: Enable the multilib repository
  # Steam is a multilib package, so the gaming profile cannot install it with
  # the repository commented out, which is how the stock pacman.conf ships.
  # This runs before the refresh below on purpose: a cache refreshed without
  # multilib does not know the packages the install then asks for.
  #
  # The replace is anchored on the commented pair the stock file carries, so a
  # second run finds nothing to change and reports no change.
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '^#\[multilib\]\n#Include = (.*)$'
    replace: '[multilib]\nInclude = \1'
  when: archwork_multilib | default(false)
  become: true

- name: Refresh the package database
  # Separate from the install, and never reported as a change. The module
  # marks update_cache changed whenever the repository contents moved, which
  # for Arch is most of the time: it compares the database before and after
  # the refresh. That is news about the mirrors, not about this machine, and
  # M2 requires a second run to report zero changed tasks.
  #
  # Found on the laptop profile, whose second run caught a repository update
  # where the desktop's runs had happened to fall in a quiet window. The
  # desktop was not more idempotent, only luckier.
  community.general.pacman:
    update_cache: true
  changed_when: false
  become: true

- name: Install the shared and profile package sets
  community.general.pacman:
    name: >-
      {{ archwork_packages_shared
         + archwork_packages_session
         + archwork_packages_applications
         + archwork_packages_profile
         + archwork_packages_gaming
         + archwork_packages_ai }}
    state: present
    # pacman aborts a download that moves slower than one byte for ten
    # seconds. On a mirror having a bad minute that ends the whole
    # transaction, and the reconcile fails on the machine rather than on the
    # mirror: a run on 2026-08-29 died there with the desktop set half
    # fetched. Nothing about this machine had changed, so let a slow transfer
    # be slow.
    extra_args: --disable-download-timeout
  become: true

- name: Configure the NVIDIA driver
  # D-027. nouveau claims an NVIDIA GPU by default, so keeping it off the
  # card and telling nvidia_drm to do its own modesetting is what the driver
  # package above needs to actually be used.
  when: archwork_nvidia_gpu | default(false)
  become: true
  block:
    - name: Blacklist nouveau and enable nvidia_drm modesetting
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nvidia.conf
        content: |
          # Managed by ArchWork. See ansible/roles/packages (D-027).
          blacklist nouveau
          options nvidia_drm modeset=1
        owner: root
        group: root
        mode: "0644"
      notify: Regenerate the initramfs
