---
# D-005: AUR packages build in a clean chroot through devtools, never on the
# workstation. D-018 places the chroot and gives the build its own account,
# because makechrootpkg refuses to run as root.
#
# Nothing here asks which machine it is running on. Both profiles get the same
# chroot; only the package list differs, and that arrives as a group variable.

- name: Create the build root
  ansible.builtin.file:
    path: "{{ archwork_build_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the build user
  # makepkg refuses to run as root, so the build needs an unprivileged account
  # to drop into. A locked password, no authorized keys and no login route
  # (D-018). It is no longer true that it appears in no sudoers file: D-033
  # gives it the package tools, because paru refuses to run as root.
  ansible.builtin.user:
    name: "{{ archwork_build_user }}"
    system: true
    home: "{{ archwork_build_home }}"
    create_home: true
    shell: /bin/bash
    password: "!"
    comment: ArchWork AUR chroot builds
  become: true

- name: Create the chroot parent directory
  # mkarchroot resolves its argument with readlink -f, which returns nothing
  # when the parent does not exist, and then reports "Please specify a working
  # directory" as though the argument were missing.
  ansible.builtin.file:
    path: "{{ archwork_chroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Look for a half-built chroot
  ansible.builtin.stat:
    path: "{{ archwork_chroot }}/root"
  register: aur_chroot_root
  become: true

- name: Look for the marker a finished chroot leaves
  ansible.builtin.stat:
    path: "{{ archwork_chroot }}/root/.arch-chroot"
  register: aur_chroot_marker
  become: true

- name: Refuse a half-built chroot rather than working around it
  # mkarchroot refuses a working directory that already exists, so a build
  # interrupted partway blocks every later run. Deleting it here would mean
  # guessing whether it is a directory or a btrfs subvolume, and @var_cache is
  # btrfs, so say what to do instead of guessing.
  ansible.builtin.fail:
    msg: >-
      {{ archwork_chroot }}/root exists without a .arch-chroot marker, so an
      earlier mkarchroot did not finish. Remove it and run again:
      btrfs subvolume delete {{ archwork_chroot }}/root
      (or rm -rf if it is a plain directory).
  when:
    - aur_chroot_root.stat.exists
    - not aur_chroot_marker.stat.exists

- name: Create the clean chroot
  # mkarchroot leaves .arch-chroot behind, which is what makes this idempotent.
  ansible.builtin.command:
    cmd: mkarchroot {{ archwork_chroot }}/root base-devel
    creates: "{{ archwork_chroot }}/root/.arch-chroot"
  become: true

- name: Check whether the AUR helper is installed
  # check_mode: false because command is skipped under --check, and the block
  # below reads the result. Asking pacman a question changes nothing.
  ansible.builtin.command: pacman -Q paru
  register: aur_paru_installed
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Bootstrap the AUR helper
  # A package build cannot be dry-run, so --check reports this skipped rather
  # than pretending. Without the second condition, --check runs the block far
  # enough to reference a variable the skipped build never set.
  when:
    - aur_paru_installed.rc != 0
    - not ansible_check_mode
  become: true
  block:
    - name: Clone the paru package repository
      ansible.builtin.git:
        repo: https://aur.archlinux.org/paru.git
        dest: "{{ archwork_build_home }}/paru"
        version: master
        single_branch: true

    - name: Give the clone to the build user
      ansible.builtin.file:
        path: "{{ archwork_build_home }}/paru"
        state: directory
        owner: "{{ archwork_build_user }}"
        group: "{{ archwork_build_user }}"
        recurse: true

    # makechrootpkg expects to be root and re-execs itself under sudo when it
    # is not, so Ansible running as root is what it wants. -U names the
    # unprivileged account it drops to for makepkg, which is the only part
    # that must not be root.
    - name: Build paru in the clean chroot
      ansible.builtin.command:
        cmd: >-
          makechrootpkg -c -r {{ archwork_chroot }}
          -U {{ archwork_build_user }}
        chdir: "{{ archwork_build_home }}/paru"
      changed_when: true

    # runuser, not sudo: root becomes another user without needing a rule, and
    # makepkg refuses to run as root even to list what it would produce.
    - name: Find the package that build produced
      ansible.builtin.command:
        cmd: runuser -u {{ archwork_build_user }} -- makepkg --packagelist
        chdir: "{{ archwork_build_home }}/paru"
      register: aur_paru_package
      changed_when: false

    - name: Install the AUR helper
      ansible.builtin.command:
        cmd: pacman -U --noconfirm {{ aur_paru_package.stdout_lines | first }}
      changed_when: true

- name: Let the build account reach the package tools
  # paru refuses to run as root, so the install below runs as the build user,
  # and that user needs pacman and the devtools chroot helpers (D-033). This
  # reverses the "nothing in sudoers" half of D-018 on purpose.
  #
  # validate is not optional here. A malformed sudoers file locks everyone out
  # of sudo on a machine whose whole recovery story assumes you can get back
  # in, and visudo -cf is what stops this role ever shipping one.
  ansible.builtin.copy:
    src: 20-archwork-build.sudoers
    dest: /etc/sudoers.d/20-archwork-build
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true

- name: Find repository packages an AUR package is replacing
  # D-034. An AUR package that declares conflicts= and provides= for a
  # repository package is a drop-in replacement, and pacman would swap them
  # given a confirmation. paru refuses before pacman ever sees it, saying it
  # "can not install conflicting packages with --noconfirm", so there is no
  # flag to answer and the repository package has to be gone first.
  #
  # Named in a variable rather than hardcoded here: this role has no business
  # knowing about Chromium, and the next replacement should be one line in
  # group_vars rather than an edit to a task.
  ansible.builtin.command:
    cmd: pacman -Q {{ item }}
  register: aur_replaced_installed
  loop: "{{ archwork_packages_aur_replaces }}"
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Remove them, so the AUR package can take their place
  # -Rdd, because the whole point is that something still depends on the name
  # being removed: mermaid-cli needs a chromium, and the AUR package provides
  # one the moment it lands. Between this task and the next the dependency is
  # unsatisfied, which is a real window and the reason this is here rather
  # than in the packages role: it closes within the same reconcile.
  ansible.builtin.command:
    cmd: pacman -Rdd --noconfirm {{ item.item }}
  loop: "{{ aur_replaced_installed.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.rc is defined
    - item.rc == 0
  changed_when: true
  become: true

- name: Install the AUR package set
  # paru builds through the same chroot, so this never leaves make dependencies
  # on the workstation (D-005). The shared list and the profile list are
  # concatenated here rather than in a profile file, so that neither this task
  # nor any group_vars file has to know what the other profile installs.
  # runuser, not become_user, for the reason this role already gives above:
  # root becomes another user without needing a rule. become_user to an
  # unprivileged account makes Ansible hand its temporary files over with
  # setfacl, which needs the acl package, and without it the run dies on
  # "chmod: invalid mode: A+user:archwork-build:rx:allow" before paru is
  # reached at all. Installing acl to work around that would be a package no
  # decision document lists, to solve a problem this role had already solved.
  #
  # HOME is set explicitly because runuser without -l keeps root's, and paru
  # keeps its clone cache under it.
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ archwork_build_user }} --
      env HOME={{ archwork_build_home }}
      paru --sync --noconfirm --chroot --needed
      {{ (archwork_packages_aur + archwork_packages_aur_profile) | join(' ') }}
  register: aur_paru_sync
  when: (archwork_packages_aur + archwork_packages_aur_profile) | length > 0
  changed_when: "'there is nothing to do' not in aur_paru_sync.stdout | lower"
  failed_when: false
  become: true

# What paru reports when a build fails is that a build failed. It does not pass
# the compiler's own output through, and makepkg's log lives inside the chroot
# copy, so a failure on 2026-09-03 produced two package names and no reason
# (D-035). The chroot is still there after the run, and nobody was going to
# look inside it by hand on a machine the harness tears down.
- name: Find the build logs of anything that failed
  ansible.builtin.find:
    paths: "/var/lib/aurbuild/x86_64/{{ archwork_build_user }}/build"
    patterns: "*.log"
    recurse: true
    file_type: file
  register: aur_build_logs
  when:
    - aur_paru_sync is defined
    - aur_paru_sync.rc is defined
    - aur_paru_sync.rc != 0
  failed_when: false
  become: true

- name: Say what the build actually said, then fail
  # The point of this task is the message. Ansible would otherwise report a
  # non-zero return code and the package names, which is what sent a person
  # into a chroot that had already been deleted.
  ansible.builtin.fail:
    msg: |-
      The AUR build failed.

      paru said:
      {{ aur_paru_sync.stderr | default('') | regex_search('error: packages failed to build.*') | default('nothing useful', true) }}

      Build logs left in the chroot, which is kept:
      {{ (aur_build_logs.files | default([]) | map(attribute='path') | list) | join('\n      ') | default('none found', true) }}

      Read them with: sudo cat <path>
  when:
    - aur_paru_sync is defined
    - aur_paru_sync.rc is defined
    - aur_paru_sync.rc != 0
