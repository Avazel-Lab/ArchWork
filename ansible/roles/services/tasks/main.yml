---
# Service state the decision documents call for. Packages are the packages
# role's job; this role decides what runs.
#
# Nothing here asks which machine it is running on. D-002 puts the same
# networking stack on both profiles deliberately.

- name: Mask the networking daemons NetworkManager replaces
  # D-002: "Mask systemd-networkd and systemd-resolved conflicts explicitly
  # rather than leaving both installed and racing." Neither is enabled on a
  # fresh Arch install, so this is a latch rather than a repair: it stops
  # anything later turning one on underneath NetworkManager.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - systemd-networkd.service
    - systemd-networkd.socket
    - systemd-resolved.service
  become: true

- name: Run NetworkManager
  # The installer enables this, so on a machine it built the task changes
  # nothing. It is here because reconciliation owns service state, and a
  # machine that lost it should get it back without a reinstall.
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
  become: true

- name: Start the Docker daemon on demand rather than at boot
  # D-019. The socket starts the daemon when something first talks to it, so
  # interactive use feels the same as always-on without a root daemon
  # listening through every boot that never touches a container.
  #
  # Podman is deliberately absent: rootless Podman has no system daemon, and
  # that is most of why applications-tooling.md wants it learned alongside
  # Docker.
  ansible.builtin.systemd_service:
    name: docker.socket
    enabled: true
    state: started
  become: true

- name: Put the administrator in the docker group
  # D-019, and the part with the real consequence: this group reaches the
  # daemon, and the daemon is root without a password prompt. Accepted
  # knowingly for a single-user workstation whose owner already holds sudo.
  #
  # Group changes only reach a session at its next login.
  ansible.builtin.user:
    name: "{{ archwork_admin_user }}"
    groups: docker
    append: true
  become: true
