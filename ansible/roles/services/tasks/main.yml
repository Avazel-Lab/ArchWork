---
# Service state the decision documents call for. Packages are the packages
# role's job; this role decides what runs.
#
# Nothing here asks which machine it is running on. D-002 puts the same
# networking stack on both profiles deliberately.

- name: Mask the networking daemons NetworkManager replaces
  # D-002: "Mask systemd-networkd and systemd-resolved conflicts explicitly
  # rather than leaving both installed and racing." Neither is enabled on a
  # fresh Arch install, so this is a latch rather than a repair: it stops
  # anything later turning one on underneath NetworkManager.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - systemd-networkd.service
    - systemd-networkd.socket
    - systemd-resolved.service
  become: true

- name: Run NetworkManager
  # The installer enables this, so on a machine it built the task changes
  # nothing. It is here because reconciliation owns service state, and a
  # machine that lost it should get it back without a reinstall.
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
  become: true

# Both of these need the docker package, which the packages role installs in
# this same run. Under --check nothing was installed, so the unit and the
# group do not exist and the tasks below would fail on a fresh machine. That
# is a limit of dry-running a playbook that installs what it then configures,
# not something to work around: --check reports them skipped instead.
- name: Configure the Docker daemon
  when: not ansible_check_mode
  become: true
  block:
    - name: Start the Docker daemon on demand rather than at boot
      # D-019. The socket starts the daemon when something first talks to it,
      # so interactive use feels the same as always-on without a root daemon
      # listening through every boot that never touches a container.
      #
      # Podman is deliberately absent: rootless Podman has no system daemon,
      # and that is most of why applications-tooling.md wants it learned
      # alongside Docker.
      ansible.builtin.systemd_service:
        name: docker.socket
        enabled: true
        state: started

    - name: Put the administrator in the docker group
      # D-019, and the part with the real consequence: this group reaches the
      # daemon, and the daemon is root without a password prompt. Accepted
      # knowingly for a single-user workstation whose owner already holds
      # sudo.
      #
      # Group changes only reach a session at its next login.
      ansible.builtin.user:
        name: "{{ archwork_admin_user }}"
        groups: docker
        append: true

# Same limit as the block above: the package arrives in this run, so under
# --check there is no unit to enable.
- name: Configure the private network
  when: not ansible_check_mode
  become: true
  block:
    - name: Run the Tailscale daemon
      # D-002 and D-019. The daemon carries no traffic until something logs it
      # in, and the auth key that would is one of the secrets D-006 has yet to
      # bring, so a rebuilt machine arrives with tailscaled running and logged
      # out. That is the honest state to arrive in: the coexistence the M3
      # criteria test is between the daemon and NetworkManager, and it holds
      # whether or not the machine is signed in.
      ansible.builtin.systemd_service:
        name: tailscaled.service
        enabled: true
        state: started
