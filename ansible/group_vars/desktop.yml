---
archwork_profile: desktop

# The desktop hardware carries a discrete NVIDIA GPU (an RTX 3060, confirmed
# on hmlxdesktop02 on 2026-08-30), which no earlier VM run ever exercised
# (D-027). nouveau claims it by default and falls back to legacy KMS, which
# left Hyprland unable to get a working render context.
archwork_nvidia_gpu: true

# Desktop runs an AMD CPU (desktop-laptop-differences.md).
archwork_packages_profile:
  - amd-ucode
  # The NVIDIA driver (D-027). nvidia-open rather than the proprietary
  # nvidia package: Ampere is on NVIDIA's supported list for the open kernel
  # modules, and nvidia-utils carries the userspace libraries, the Vulkan
  # ICD and nvidia-smi that nvidia-open does not.
  - nvidia-open
  - nvidia-utils

# Steam is in multilib, so the profile that games is the profile that enables
# it. The laptop does not (desktop-laptop-differences.md).
archwork_multilib: true

# Gaming and local AI, the two application differences the profile table names.
# Both are desktop only: the laptop excludes gaming outright, and carries no
# local AI models, so the runtimes that serve them have nothing to do there.
archwork_packages_gaming:
  - steam
  - mangohud
  - gamemode
  - lutris

archwork_packages_ai:
  # The local model runtime. @ai_models is the desktop's subvolume for what it
  # downloads, and the laptop has no models deployed.
  - ollama

# Profile-only AUR packages, on top of the shared set in group_vars/all.yml.
archwork_packages_aur_profile:
  # Gaming: GE-Proton management, and the Epic/GOG/Amazon launcher.
  - protonup-qt
  - heroic-games-launcher-bin
  # Local AI model management and UI.
  - lmstudio-bin
  # Stream Deck management, desktop-specific rather than on every machine
  # (applications.md, desktop-laptop-differences.md). opendeck-bin rather than
  # opendeck (D-035), same version and the same reasoning as joplin-bin. Its
  # two dependencies both resolve from the official repositories: webkit2gtk-4.1
  # is in extra, and libappindicator-gtk3 is what extra/libappindicator
  # provides and replaces, so neither drags in another AUR build.
  - opendeck-bin
