---
# Every ArchWork machine configures itself (D-016). Nothing in the build path
# requires a second machine, so Ansible never connects over the network.
#
# The M1 installer sets the host name to the one inventory/hosts.yml names, so
# with this setting the committed inventory works unchanged on real hardware
# and in a test VM:
#
#   ansible-playbook -l "$(hostname)" site.yml
ansible_connection: local

# AUR builds (D-005, D-018). The chroot lives under /var/cache, which is
# @var_cache and so outside the rollback boundary: it is a build cache, it is
# large, and a rollback has no reason to carry it.
archwork_build_root: /var/cache/archwork
archwork_build_home: /var/cache/archwork/build
archwork_chroot: /var/cache/archwork/chroot
archwork_build_user: archwork-build

# The administrator account the installer creates. Same on both profiles, so
# it belongs here rather than in host_vars (D-010).
archwork_admin_user: gary

# Where the installer clones this repository, matching REPO_PATH in
# scripts/archwork-install.sh. The dotfiles role links the user configuration
# at this clone rather than copying it, so an edit made at the machine is an
# edit to the repository.
archwork_repo_dir: "/home/{{ archwork_admin_user }}/src/ArchWork"
archwork_dotfiles_dir: "{{ archwork_repo_dir }}/dotfiles"

# Directories under dotfiles/ that become directories under ~/.config. Whole
# directories rather than single files, so a new file in one arrives on the
# machine without a change here.
archwork_dotfile_links:
  - hypr
  # Theming (D-020). GTK 3 is the one that matters most: the portal file
  # chooser is a GTK 3 application, so gtk-3.0 is what stops it coming up
  # light against a dark desktop.
  - gtk-3.0
  - gtk-4.0
  - Kvantum

# Whether this profile enables the multilib repository. Steam is a multilib
# package and cannot be installed without it, so the profile that games needs
# it and the profile that does not should not carry a 32-bit repository it
# never uses. Read by the packages role, set in a profile file, so nothing in
# the role asks which machine it is on.
archwork_multilib: false

# Whether this profile's GPU needs the driver stack the packages role
# configures below (D-027). False by default, and set true in a profile file
# rather than read here, so nothing in the packages role asks which machine
# it is running on.
archwork_nvidia_gpu: false

# The graphical session (M3). Separate from archwork_packages_shared, which is
# base tooling, because M6 has to install exactly this set with Quickshell
# removed and prove the desktop still works. A named list makes that test mean
# something; a comment heading inside one flat list would not.
#
# Both profiles get all of it. desktop-laptop-differences.md makes the desktop
# environment shared and lists only microcode, AI models, gaming, swap, kernel
# parameters and the host name as differences. archwork_packages_profile is
# the AMD or Intel box, not the desktop environment.
archwork_packages_session:
  # Compositor and session entry (desktop-shell.md, D-004)
  - hyprland
  - greetd
  - greetd-tuigreet
  # Portals and privilege UI (desktop-shell.md)
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - hyprpolkitagent
  # Terminal, launcher, lock screen, wallpaper (desktop-shell.md, D-001)
  - kitty
  - fuzzel
  - hyprlock
  - hyprpaper
  # Notifications until Quickshell takes them at M6, and part of the fallback
  # set that must keep working afterwards (desktop-shell.md)
  - mako
  # The bar, on the same terms as mako: conventional now, replaced by a
  # Quickshell module at M6, kept afterwards so a broken shell still leaves a
  # usable desktop (desktop-shell.md, D-020). No dotfiles: waybar's packaged
  # configuration is enough for a fallback, and the M3 criteria do not test a
  # bar. Style it once Quickshell has taken the job, or not at all.
  - waybar
  # Screenshots, which the M3 exit criteria test (desktop-shell.md)
  - grim
  # Secret Service, so the greetd password unlocks the keyring (D-012)
  - gnome-keyring
  # Theming, Qt and GTK, as a matched pair from one project (D-020).
  # desktop-shell.md asks for Kvantum "with a matching GTK theme", and Materia
  # ships both, so matching is a fact about the theme rather than a judgement
  # about two that happen to be dark. Both are in extra, so neither needs the
  # AUR path D-005 routes through a clean chroot.
  - kvantum
  - kvantum-theme-materia
  - materia-gtk-theme
  # Icons, which Materia does not ship (D-020). Papirus-Dark is the
  # conventional pairing and the only icon set either document names.
  - papirus-icon-theme
  # Fonts, as the application baseline names them (D-020). The noto set covers
  # Unicode, emoji and CJK, Inter is the UI face, Liberation carries the metric
  # compatibility with the common Microsoft faces that documents rely on, and
  # the nerd variant of JetBrains Mono is the terminal face. That last one also
  # stops waybar's packaged configuration drawing its icons as boxes.
  - noto-fonts
  - noto-fonts-emoji
  - noto-fonts-cjk
  - inter-font
  - ttf-liberation
  - ttf-jetbrains-mono-nerd
  # The two applications the portal criterion opens a file picker from
  # (D-023), GTK and Qt. Both are named in the application baseline, so this
  # decides where they land rather than inventing a package for a test.
  # Kvantum Manager was the first Qt candidate and binds no accelerator at
  # all, which a run found out.
  - pdfarranger
  - okular

# AUR packages, pinned by name like everything else (D-005). Every one builds
# in the clean chroot the aur role makes, so none of them leaves make
# dependencies on the workstation.
#
# Shared across both profiles. The profile-only AUR packages are in
# archwork_packages_aur_profile, which is where gaming and local AI land,
# because desktop-laptop-differences.md excludes both from the laptop.
#
# The -bin variants are deliberate where upstream ships a binary: building
# Chromium or VS Code from source in a chroot costs hours and produces the same
# program. Quickshell and Satty are absent because they arrive at M6.
archwork_packages_aur:
  # Browsers (applications.md). Zen is primary, Ungoogled Chromium secondary.
  - zen-browser-bin
  - ungoogled-chromium-bin
  # The primary IDE. visual-studio-code-bin is Microsoft's own build, which is
  # what the baseline names; the `code` package in extra is the OSS build
  # without the Marketplace, so it is a different program.
  - visual-studio-code-bin
  # Notes
  - joplin-desktop
  # Password managers. NordPass is primary, Bitwarden is in extra below.
  - nordpass-bin
  # Media library management
  - tinymediamanager-bin
  # Indexed file search, the closest fit to Everything (applications.md)
  - fsearch
  # Graphical API client
  - bruno-bin
  # AI coding CLI. Codex is not here: see docs/decisions/log.md D-029.
  - claude-code
  # The Epson FastFoto FF-680W's scanner driver. Installed so the workflow can
  # be tried when the scanner is next to the machine; applications.md is
  # explicit that the driver is not the criterion, a tested batch and ADF
  # workflow is. Added on the repository owner's call, 2026-09-01 (D-029,
  # question 4). Its presence here is not evidence that scanning works.
  - epsonscan2

# AUR packages for one profile only. Empty here, set in group_vars/desktop.yml.
archwork_packages_aur_profile: []

# Packages required on both profiles.
#
# Every entry traces to docs/decisions/applications-tooling.md or to a decision
# in docs/decisions/log.md. Nothing is added here that no decision document
# lists. Names are as Arch names them, which is not always how the decision
# document writes the tool:
#
#   Pandoc   -> pandoc-cli   (pandoc is not a package name)
#   xorriso  -> libisoburn   (the xorriso binary ships in libisoburn)
#
# ansible, age and python appear here and are also pacstrapped by the M1
# installer. That is not duplication: this playbook cannot be what installs
# the tools it needs to run, and bootstrap needs age before any network
# exists to fetch it (D-016).
#
# Packages the base install already places (base, linux, btrfs-progs,
# cryptsetup, mkinitcpio, networkmanager, zram-generator, sudo, git, vim,
# openssh, microcode) are not repeated here. This role reconciles what M1 did
# not install.
archwork_packages_shared:
  # Development and platform tooling
  - ansible
  - devtools
  - age
  - jq
  - curl
  - gawk
  - nodejs
  - npm
  - python
  - python-pip
  - shellcheck
  - pandoc-cli
  - libisoburn
  - mermaid-cli
  # Containers and orchestration. Podman is the engine on this workstation and
  # Docker is a client for remote systems such as the VPS, which is why
  # nothing enables docker.socket and nobody is in the docker group (D-025).
  # Arch ships no separate Docker client package, so the daemon arrives with
  # the CLI and is simply never started.
  - podman
  - podman-compose
  - docker
  - kubectl
  # Audio, PipeWire with WirePlumber on both profiles (D-003)
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - pipewire-pulse
  - wireplumber
  # Snapshots and backup (D-007, D-009)
  - btrbk
  # The private network (D-002, D-019). It arrives at M3, not earlier: M3 is
  # where the exit criteria test that it comes up and coexists with
  # NetworkManager, and installing a VPN daemon a milestone early proves
  # nothing.
  - tailscale

# The application baseline, from docs/decisions/applications.md, on both
# profiles. Everything here is in the official repositories; the AUR half is
# archwork_packages_aur above.
#
# Separate from archwork_packages_shared, which is the tooling the platform
# itself needs, for the same reason archwork_packages_session is separate: the
# lists answer different questions and a rebuild that dropped this one would
# still be a working machine, just not the workstation. M7's exit criteria ask
# that this list account for applications.md, and D-029 records what is
# deliberately left out of it and why.
#
# Entries the platform already installs elsewhere are not repeated: okular and
# pdfarranger are in the session set for the M3 portal criterion, pandoc-cli,
# jq, shellcheck, curl, nodejs, npm, python, podman, docker, kubectl, ansible,
# age, btrbk, tailscale and mermaid-cli are in the shared set, and git, vim,
# openssh and openssl come from the base install.
archwork_packages_applications:
  # Editors. The terminal half; VS Code is the AUR half.
  - neovim
  # Documents and office. Fresh rather than still: this is a rolling
  # workstation and there is no reason to hold the office suite back.
  - libreoffice-fresh
  # Images
  - gwenview
  - pinta
  # Archives
  - peazip
  # Password managers, the secondary. NordPass is the AUR half.
  - bitwarden
  # Media. Spotify is a PWA by decision and has no package here.
  - vlc
  - handbrake
  # Communication. WhatsApp is a PWA and has no package here.
  - discord
  # Torrenting
  - qbittorrent
  # Remote access. freerdp is what gives remmina its RDP backend, which is the
  # protocol the estate actually uses.
  - remmina
  - freerdp
  # Virtualisation. qemu-desktop rather than qemu-full: the full set pulls
  # every architecture's firmware and emulator, and this workstation runs
  # x86_64 guests, including the ArchWork rebuild VMs virt-manager is named
  # for.
  - qemu-desktop
  - libvirt
  - virt-manager
  # applications.md names virt-manager and not these two, and without them the
  # stack installs and cannot do the thing it is listed for: libvirt's default
  # NAT network needs dnsmasq, and a UEFI guest needs edk2-ovmf. Every ArchWork
  # test VM is a UEFI guest. Answered by the repository owner on 2026-09-01
  # (D-029, question 3): applications.md named a capability, not a package
  # list.
  - dnsmasq
  - edk2-ovmf
  # Kubernetes. The kubectx package ships kubens too.
  - helm
  - k9s
  - kubectx
  - stern
  # DevOps and infrastructure as code. Terraform rather than OpenTofu, which
  # applications.md chooses explicitly.
  - ansible-lint
  - terraform
  - packer
  - vault
  - github-cli
  - glab
  - pre-commit
  # Git. git-crypt is here for other repositories that use it, and is not a
  # mechanism for this one's secrets (D-006, D-024).
  - git-crypt
  - lazygit
  - meld
  # How Python is pinned. applications.md asks for 3.13 "managed explicitly
  # rather than depending on Arch's rolling system Python staying at 3.13" and
  # names no mechanism. uv is the answer, chosen by the repository owner on
  # 2026-09-01 (D-029, question 2): it fetches and pins an interpreter per
  # project rather than installing a second system-wide Python that pacman
  # would also want to upgrade, so nothing ends up with two interpreters on
  # PATH hoping the right one wins.
  - uv
  # General CLI and developer utilities
  - ripgrep
  - fd
  - fzf
  - bat
  - eza
  - zoxide
  - tree
  - tmux
  - rsync
  - shfmt
  - make
  - just
  - yq
  # API and network diagnostics. bind is the package that carries dig: Arch
  # has no separate bind-tools, and bind provides it. That brings named
  # along with it, which nothing here enables and nothing should.
  - httpie
  - nmap
  - mtr
  - iperf3
  - bind
  - whois
  - openbsd-netcat
  - tcpdump
  - wireshark-qt
  # Game development. Not gaming: desktop-laptop-differences.md excludes
  # gaming from the laptop and says nothing about building games, and an
  # engine is a development tool.
  - godot
  # Security and secrets
  - lynis
  - yubikey-manager
  - libfido2
  - gnupg
  # Backup and sync. btrbk is the Btrfs snapshot half and is already shared.
  - restic
  - rclone
  # System monitoring
  - btop
  - mission-center
  - nvtop
  # Disk and storage. xorriso arrives as libisoburn in the shared set.
  - gparted
  - gnome-disk-utility
  - baobab
  - ncdu
  - duf
  - parted
  # Hardware diagnostics and testing. The -efi build of memtest86+ is the one
  # a UEFI machine with systemd-boot can actually launch.
  - smartmontools
  - nvme-cli
  - lm_sensors
  - lshw
  - pciutils
  - usbutils
  - dmidecode
  - memtest86+-efi
  - stress-ng
  - fio
  # Audio, for troubleshooting the PipeWire stack in the shared set
  - pavucontrol
  # Phone integration
  - kdeconnect
  # Peripheral management. OpenDeck is desktop only and sits in the profile.
  - solaar
  # Printing and scanning. The hardware behind these two is not proven yet:
  # D-029 records what still has to be tested on the real printer and scanner.
  - cups
  - hplip
  - sane
  - sane-airscan
